    <script>
      // Safeguard against 'Cannot set property fetch of #<Window> which has only a getter'
      (function () {
        try {
          var currentFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && protoDesc.configurable && !protoDesc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {
          // Silent fail-safe
        }
      })();
    </script>
