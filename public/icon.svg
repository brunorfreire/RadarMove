<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#031d17" />
      <stop offset="100%" stop-color="#011812" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle Outer Radar Rings in Safe Zone -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />

  <!-- Radar Sweep Center -->
  <circle cx="256" cy="256" r="16" fill="url(#glow)" filter="url(#shadow)" />
  
  <!-- Dynamic Pulse/Activity Path (RadarMove ECG & Movement) -->
  <path 
    d="M 112 256 L 180 256 L 210 170 L 256 340 L 300 200 L 330 256 L 400 256" 
    fill="none" 
    stroke="url(#glow)" 
    stroke-width="22" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- High-tech satellite ping dot -->
  <circle cx="360" cy="150" r="12" fill="#06b6d4" filter="url(#shadow)" />
  <circle cx="360" cy="150" r="24" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2" />
</svg>
